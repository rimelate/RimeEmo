name: Validate package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    if: github.ref != 'refs/heads/vpm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release pipeline and validate package contents
        shell: bash
        run: |
          python -m unittest discover -s Scripts~ -p 'test_*.py'
          VERSION=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          python Scripts~/release.py build --tag "v$VERSION" --output dist~
      - uses: actions/upload-artifact@v4
        with:
          name: rimeemo-vpm-package
          path: dist~/
